<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bengaluru Tech Summit Chatbot</title>
    <style>t
    
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .demo-container {
        text-align: center;
        color: white;
        padding: 2rem;
      }

      .demo-container h1 {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      }

      .demo-container p {
        font-size: 1.2rem;
        opacity: 0.9;
        margin-bottom: 2rem;
      }

      /* Chatbot Widget Styles */
      .chatbot-widget {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }

      .chatbot-toggle {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 24px;
      }

      .chatbot-toggle:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
      }

      .chatbot-toggle:active {
        transform: scale(0.95);
      }

      .chatbot-window {
        position: fixed;
        bottom: 90px;
        right: 20px;
        width: 400px;
        height: 600px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        display: none;
        flex-direction: column;
        overflow: hidden;
        z-index: 1000;
      }

      .chatbot-window.active {
        display: flex;
      }

      .chatbot-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .chatbot-header h3 {
        font-size: 18px;
        font-weight: 600;
      }

      .chatbot-close {
        background: none;
        border: none;
        color: white;
        font-size: 20px;
        cursor: pointer;
        padding: 5px;
        border-radius: 50%;
        transition: background 0.3s ease;
      }

      .chatbot-close:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .chatbot-messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        background: #f8f9fa;
      }

      .message {
        margin-bottom: 15px;
        display: flex;
        align-items: flex-start;
      }

      .message.user {
        justify-content: flex-end;
      }

      .message.bot {
        justify-content: flex-start;
      }

      .message-content {
        max-width: 80%;
        padding: 12px 16px;
        border-radius: 18px;
        font-size: 14px;
        line-height: 1.4;
        word-wrap: break-word;
      }

      .message.user .message-content {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-bottom-right-radius: 4px;
      }

      .message.bot .message-content {
        background: white;
        color: #333;
        border: 1px solid #e1e5e9;
        border-bottom-left-radius: 4px;
      }

      /* HTML content styling */
      .message.bot .message-content p {
        margin: 0 0 10px 0;
      }

      .message.bot .message-content p:last-child {
        margin-bottom: 0;
      }

      .message.bot .message-content strong {
        font-weight: 600;
        color: #667eea;
      }

      .message.bot .message-content ul {
        margin: 8px 0;
        padding-left: 20px;
      }

      .message.bot .message-content li {
        margin-bottom: 6px;
        line-height: 1.5;
      }

      .message.bot .message-content li:last-child {
        margin-bottom: 0;
      }

      .message-details {
        margin-top: 8px;
        font-size: 12px;
        color: #666;
      }

      /* Token usage and documents are hidden from frontend but still stored in backend */

      .typing-indicator {
        display: none;
        align-items: center;
        padding: 12px 16px;
        background: white;
        border: 1px solid #e1e5e9;
        border-radius: 18px;
        border-bottom-left-radius: 4px;
        max-width: 80%;
      }

      .typing-indicator.active {
        display: flex;
      }

      .typing-dots {
        display: flex;
        gap: 4px;
      }

      .typing-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ccc;
        animation: typing 1.4s infinite ease-in-out;
      }

      .typing-dot:nth-child(1) {
        animation-delay: -0.32s;
      }
      .typing-dot:nth-child(2) {
        animation-delay: -0.16s;
      }

      @keyframes typing {
        0%,
        80%,
        100% {
          transform: scale(0.8);
          opacity: 0.5;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .chatbot-input {
        padding: 20px;
        background: white;
        border-top: 1px solid #e1e5e9;
      }

      .input-container {
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }

      .message-input {
        flex: 1;
        border: 1px solid #e1e5e9;
        border-radius: 20px;
        padding: 12px 16px;
        font-size: 14px;
        resize: none;
        outline: none;
        transition: border-color 0.3s ease;
        font-family: inherit;
        max-height: 100px;
        min-height: 44px;
      }

      .message-input:focus {
        border-color: #667eea;
      }

      .send-button {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 50%;
        width: 44px;
        height: 44px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        font-size: 18px;
      }

      .send-button:hover {
        transform: scale(1.05);
      }

      .send-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .error-message {
        background: #fee;
        color: #c33;
        padding: 10px;
        border-radius: 8px;
        margin: 10px 0;
        font-size: 13px;
        border-left: 3px solid #c33;
      }

      /* Responsive Design */
      @media (max-width: 480px) {
        .chatbot-window {
          width: calc(100vw - 40px);
          height: calc(100vh - 120px);
          bottom: 80px;
          right: 20px;
          left: 20px;
        }

        .demo-container h1 {
          font-size: 2rem;
        }

        .demo-container p {
          font-size: 1rem;
        }
      }

      /* Welcome message styling */
      .welcome-message {
        text-align: center;
        padding: 20px;
        color: #666;
      }

      .welcome-message h4 {
        color: #667eea;
        margin-bottom: 10px;
      }

      .welcome-message p {
        font-size: 13px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="demo-container">
      <h1>Bengaluru Tech Summit</h1>
      <p>
        Ask me anything about the event! Click the chat button to get started.
      </p>
    </div>

    <!-- Chatbot Widget -->
    <div class="chatbot-widget">
      <button class="chatbot-toggle" onclick="toggleChatbot()">💬</button>

      <div class="chatbot-window" id="chatbotWindow">
        <div class="chatbot-header">
          <h3>Bengaluru Tech Summit Assistant</h3>
          <button class="chatbot-close" onclick="toggleChatbot()">×</button>
        </div>

        <div class="chatbot-messages" id="chatbotMessages">
          <div class="welcome-message">
            <h4>👋 Welcome!</h4>
            <p>
              I'm here to help you with information about the Bengaluru Tech
              Summit. Ask me anything about registration, schedules, speakers,
              or general information!
            </p>
          </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
          <div class="typing-dots">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>

        <div class="chatbot-input">
          <div class="input-container">
            <textarea
              class="message-input"
              id="messageInput"
              placeholder="Type your question here..."
              rows="1"
              onkeydown="handleKeyDown(event)"
            ></textarea>
            <button class="send-button" id="sendButton" onclick="sendMessage()">
              ➤
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Chatbot state
      let isOpen = false;
      let isLoading = false;

      // API configuration
      const API_BASE_URL = "http://localhost:8000";

      // DOM elements
      const chatbotWindow = document.getElementById("chatbotWindow");
      const chatbotMessages = document.getElementById("chatbotMessages");
      const messageInput = document.getElementById("messageInput");
      const sendButton = document.getElementById("sendButton");
      const typingIndicator = document.getElementById("typingIndicator");

      // Toggle chatbot window
      function toggleChatbot() {
        isOpen = !isOpen;
        chatbotWindow.classList.toggle("active", isOpen);

        if (isOpen) {
          messageInput.focus();
        }
      }

      // Handle Enter key
      function handleKeyDown(event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      }

      // Auto-resize textarea
      messageInput.addEventListener("input", function () {
        this.style.height = "auto";
        this.style.height = Math.min(this.scrollHeight, 100) + "px";
      });

      // Send message function
      async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message || isLoading) return;

        // Add user message to chat
        addMessage(message, "user");
        messageInput.value = "";
        messageInput.style.height = "auto";

        // Show typing indicator
        showTypingIndicator();

        try {
          // Send to API
          const response = await fetch(`${API_BASE_URL}/ask_auto`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ question: message }),
          });

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const data = await response.json();

          // Hide typing indicator
          hideTypingIndicator();

          // Add bot response
          addBotMessage(data);
        } catch (error) {
          console.error("Error:", error);
          hideTypingIndicator();
          addErrorMessage("Sorry, something went wrong. Please try again.");
        }
      }

      // Add user message
      function addMessage(content, type) {
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${type}`;

        const contentDiv = document.createElement("div");
        contentDiv.className = "message-content";
        contentDiv.textContent = content;

        messageDiv.appendChild(contentDiv);
        chatbotMessages.appendChild(messageDiv);

        // Scroll to bottom
        chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
      }

      // Add bot message with details
      function addBotMessage(data) {
        const messageDiv = document.createElement("div");
        messageDiv.className = "message bot";

        const contentDiv = document.createElement("div");
        contentDiv.className = "message-content";
        contentDiv.innerHTML = data.answer;

        messageDiv.appendChild(contentDiv);

        // Note: Token usage and relevant documents are still stored in the backend
        // and can be viewed in the dashboard, but hidden from the frontend for cleaner UI

        chatbotMessages.appendChild(messageDiv);
        chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
      }

      // Add error message
      function addErrorMessage(message) {
        const errorDiv = document.createElement("div");
        errorDiv.className = "error-message";
        errorDiv.textContent = message;
        chatbotMessages.appendChild(errorDiv);
        chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
      }

      // Show typing indicator
      function showTypingIndicator() {
        isLoading = true;
        sendButton.disabled = true;
        typingIndicator.classList.add("active");
        chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
      }

      // Hide typing indicator
      function hideTypingIndicator() {
        isLoading = false;
        sendButton.disabled = false;
        typingIndicator.classList.remove("active");
      }

      // Close chatbot when clicking outside (optional)
      document.addEventListener("click", function (event) {
        if (isOpen && !event.target.closest(".chatbot-widget")) {
          // Uncomment the line below if you want to close when clicking outside
          // toggleChatbot();
        }
      });

      // Initialize
      console.log("Bengaluru Tech Summit Chatbot loaded!");
      console.log(
        "Make sure your FastAPI server is running on http://localhost:8000"
      );
    </script>
  </body>
</html>
